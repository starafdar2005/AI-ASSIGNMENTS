<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#f8fafc"/>
  <text x="450" y="50" text-anchor="middle" font-size="26" font-family="Arial" fill="#111827">Azure DevOps Pipeline for the AI Webpage Tester</text>
  <rect x="80" y="120" width="180" height="80" rx="10" fill="#2563eb"/>
  <text x="170" y="165" text-anchor="middle" font-size="20" font-family="Arial" fill="white">1. Pull Code</text>
  <rect x="320" y="120" width="180" height="80" rx="10" fill="#7c3aed"/>
  <text x="410" y="165" text-anchor="middle" font-size="20" font-family="Arial" fill="white">2. Install deps</text>
  <rect x="560" y="120" width="180" height="80" rx="10" fill="#059669"/>
  <text x="650" y="165" text-anchor="middle" font-size="20" font-family="Arial" fill="white">3. Run tests</text>
  <rect x="320" y="280" width="240" height="100" rx="10" fill="#dc2626"/>
  <text x="440" y="325" text-anchor="middle" font-size="20" font-family="Arial" fill="white">4. Execute agent flow</text>
  <line x1="260" y1="160" x2="320" y2="160" stroke="#374151" stroke-width="3"/>
  <line x1="500" y1="160" x2="560" y2="160" stroke="#374151" stroke-width="3"/>
  <line x1="650" y1="200" x2="650" y2="280" stroke="#374151" stroke-width="3"/>
  <line x1="560" y1="330" x2="500" y2="330" stroke="#374151" stroke-width="3"/>
  <text x="450" y="440" text-anchor="middle" font-size="18" font-family="Arial" fill="#374151">Scraper → Test Generator → Executor → Result</text>
</svg>
